name: durable_queue_sqlite
description: SQLite storage for durable_queue. Persists tasks across app restarts with indexed, transactional queries.
version: 0.1.0
repository: https://github.com/boffincoders/durable_queue/tree/main/packages/durable_queue_sqlite
issue_tracker: https://github.com/boffincoders/durable_queue/issues
topics:
  - queue
  - sqlite
  - persistence
  - offline
  - retry

environment:
  sdk: ^3.13.0

# Native SQLite through dart:ffi. Not available on the web.
platforms:
  android:
  ios:
  linux:
  macos:
  windows:

resolution: workspace

dependencies:
  durable_queue: ^0.3.1
  sqlite3: ^3.7.0

dev_dependencies:
  durable_queue_test_support:
    path: ../durable_queue_test_support
  lints: ^6.1.0
  test: ^1.33.0
