name: durable_queue_transfer
description: Uploads and downloads for durable_queue that keep going after the app is minimised or closed, run by background_downloader, with the queue's retries and dependencies.
version: 0.1.2
repository: https://github.com/boffincoders/durable_queue/tree/main/packages/durable_queue_transfer
issue_tracker: https://github.com/boffincoders/durable_queue/issues
topics:
  - queue
  - upload
  - download
  - background
  - offline
screenshots:
  - description: Photo uploads that finish after the app is closed, shown by the demo app and its test server.
    path: screenshots/demo.webp

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

# Not part of the root pub workspace: this package needs the Flutter SDK,
# and the other packages must stay resolvable with plain Dart.

dependencies:
  background_downloader: ^9.6.4
  durable_queue: ^0.5.4
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.1.0
