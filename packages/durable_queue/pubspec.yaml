name: durable_queue
description: 'Persistent, retryable task execution for Dart and Flutter: tasks survive crashes and restarts, with retries, priorities, dependencies, offline waiting, and recovery.'
version: 0.5.10
repository: https://github.com/boffincoders/durable_queue/tree/main/packages/durable_queue
issue_tracker: https://github.com/boffincoders/durable_queue/issues
documentation: https://boffincoders.github.io/durable_queue/
topics:
  - queue
  - retry
  - offline
  - background
  - persistence
screenshots:
  - description: Photo uploads that finish after the app is closed, shown by the demo app and its test server.
    path: screenshots/demo.webp
  - description: How durable_queue and its packages fit together.
    path: screenshots/architecture.png

environment:
  sdk: ^3.13.0

resolution: workspace

dev_dependencies:
  durable_queue_test_support:
    path: ../durable_queue_test_support
  lints: ^6.1.0
  test: ^1.33.0
