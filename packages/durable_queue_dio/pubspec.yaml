name: durable_queue_dio
description: Dio integration for durable_queue. Retry rules for HTTP errors, Retry-After, idempotency headers, cancellation, and queued HTTP requests.
version: 0.2.2
repository: https://github.com/boffincoders/durable_queue/tree/main/packages/durable_queue_dio
issue_tracker: https://github.com/boffincoders/durable_queue/issues
topics:
  - queue
  - dio
  - http
  - retry
  - offline

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  dio: ^5.11.1
  durable_queue: '>=0.5.8 <0.6.0'
  http_parser: ^4.1.2

dev_dependencies:
  durable_queue_sqlite: ^0.2.1
  lints: ^6.1.0
  test: ^1.33.0
