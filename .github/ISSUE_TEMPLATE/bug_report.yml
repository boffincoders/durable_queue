name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a security problem, do not open an issue: see [SECURITY.md](https://github.com/boffincoders/durable_queue/blob/main/SECURITY.md).
  - type: dropdown
    id: package
    attributes:
      label: Package
      multiple: true
      options:
        - durable_queue
        - durable_queue_sqlite
        - durable_queue_hive
        - durable_queue_encryption
        - durable_queue_dio
        - durable_queue_flutter
        - durable_queue_connectivity
        - durable_queue_transfer
        - durable_queue_workmanager
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Package versions
      description: From pubspec.lock, for every durable_queue package you use.
      placeholder: durable_queue 0.5.5, durable_queue_sqlite 0.2.2
    validations:
      required: true
  - type: textarea
    id: sdk
    attributes:
      label: Dart or Flutter version
      description: The output of `flutter --version` or `dart --version`.
      render: text
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - Android
        - iOS
        - macOS
        - Windows
        - Linux
        - Web
        - Dart VM (server or CLI)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include errors, stack traces, and `storageErrors` or task events if you have them.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The smallest code that shows the problem. A failing test is ideal.
      render: dart
    validations:
      required: true
