name: Device tests

# Kills the demo app while uploads are running, on an Android emulator and
# an iOS simulator, and checks that every photo is uploaded and announced
# exactly once afterwards. See examples/durable_queue_demo/tool/kill_test.dart.

# They take about 20 minutes and use macOS runner time, so they run only
# when code the demo app runs has changed (not docs or other packages'
# tests), and on demand from the Actions tab.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/durable_queue/lib/**'
      - 'packages/durable_queue_sqlite/lib/**'
      - 'packages/durable_queue_dio/lib/**'
      - 'packages/durable_queue_connectivity/lib/**'
      - 'packages/durable_queue_flutter/lib/**'
      - 'packages/durable_queue_transfer/lib/**'
      - 'examples/durable_queue_demo/lib/**'
      - 'examples/durable_queue_demo/tool/**'
      - 'examples/durable_queue_demo/pubspec.yaml'
      - '.github/workflows/device-tests.yml'

jobs:
  android:
    name: Android emulator (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [34]
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          working-directory: examples/durable_queue_demo
          script: bash tool/ci_android.sh

  ios:
    name: iOS simulator
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: examples/durable_queue_demo
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: bash tool/ci_ios.sh