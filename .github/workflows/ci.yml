name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  durable_queue:
    name: durable_queue (Dart ${{ matrix.sdk }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sdk: ['3.13.0', stable]
    defaults:
      run:
        working-directory: packages/durable_queue
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test
      - run: dart pub publish --dry-run

  durable_queue_sqlite:
    name: durable_queue_sqlite (${{ matrix.os }}, Dart ${{ matrix.sdk }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        sdk: ['3.13.0', stable]
    defaults:
      run:
        working-directory: packages/durable_queue_sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      # package:sqlite3 downloads a prebuilt SQLite through its build hook.
      - run: dart test
      - run: dart run example/main.dart
      - run: dart pub publish --dry-run

  durable_queue_test_support:
    name: durable_queue_test_support
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/durable_queue_test_support
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos