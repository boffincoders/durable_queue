name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  durable_queue:
    name: durable_queue (Dart ${{ matrix.sdk }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sdk: ['3.13.0', stable]
    defaults:
      run:
        working-directory: packages/durable_queue
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test
      - run: dart pub publish --dry-run

  durable_queue_sqlite:
    name: durable_queue_sqlite (${{ matrix.os }}, Dart ${{ matrix.sdk }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        sdk: ['3.13.0', stable]
    defaults:
      run:
        working-directory: packages/durable_queue_sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      # package:sqlite3 downloads a prebuilt SQLite through its build hook.
      - run: dart test
      - run: dart run example/main.dart
      # 0.1.0 broke web builds. Compile a small web entry point so that
      # cannot happen again unnoticed.
      - name: Web build check
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p web_check
          printf "import 'package:durable_queue_sqlite/durable_queue_sqlite.dart';\n\nFuture<void> main() async {\n  await SqliteQueueStorage.openWeb('ci');\n}\n" > web_check/main.dart
          dart compile js -o "$RUNNER_TEMP/web_check.js" web_check/main.dart
          rm -rf web_check
      - run: dart pub publish --dry-run

  durable_queue_dio:
    name: durable_queue_dio (${{ matrix.os }}, Dart ${{ matrix.sdk }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        sdk: ['3.13.0', stable]
    defaults:
      run:
        working-directory: packages/durable_queue_dio
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      # Tests start a local HTTP server and use durable_queue_sqlite.
      - run: dart test
      - run: dart run example/main.dart
      - run: dart pub publish --dry-run

  durable_queue_encryption:
    name: durable_queue_encryption (${{ matrix.os }}, Dart ${{ matrix.sdk }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        sdk: ['3.13.0', stable]
    defaults:
      run:
        working-directory: packages/durable_queue_encryption
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      # Includes the storage contract over SQLite (its build hook downloads
      # SQLite).
      - run: dart test
      # In a browser, encryption runs through the Web Crypto API.
      - name: Browser tests
        if: matrix.os == 'ubuntu-latest'
        run: dart test -p chrome
      - run: dart run example/main.dart
      - run: dart pub publish --dry-run

  durable_queue_hive:
    name: durable_queue_hive (${{ matrix.os }}, Dart ${{ matrix.sdk }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        sdk: ['3.13.0', stable]
    defaults:
      run:
        working-directory: packages/durable_queue_hive
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      # Includes a test that kills a writing process with SIGKILL.
      - run: dart test
      # On the web, Hive stores the box in IndexedDB.
      - name: Browser tests
        if: matrix.os == 'ubuntu-latest'
        run: dart test -p chrome
      - run: dart run example/main.dart
      - run: dart pub publish --dry-run

  durable_queue_test_support:
    name: durable_queue_test_support
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/durable_queue_test_support
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos

  benchmark:
    # The benchmarks must keep working; a quick run with small sizes. The
    # full run is the Benchmarks workflow, started by hand.
    name: benchmark (quick run)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: benchmark
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart run bin/benchmark.dart --quick

  durable_queue_connectivity:
    # A Flutter package outside the Dart workspace, resolved on its own.
    name: durable_queue_connectivity (Flutter ${{ matrix.channel }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        channel: [stable]
    defaults:
      run:
        working-directory: packages/durable_queue_connectivity
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.channel }}
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - run: flutter pub publish --dry-run

  durable_queue_flutter:
    # A Flutter package outside the Dart workspace, resolved on its own.
    name: durable_queue_flutter (Flutter ${{ matrix.channel }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        channel: [stable]
    defaults:
      run:
        working-directory: packages/durable_queue_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.channel }}
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - run: flutter pub publish --dry-run

  durable_queue_workmanager:
    # A Flutter package outside the Dart workspace, resolved on its own.
    name: durable_queue_workmanager (Flutter ${{ matrix.channel }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        channel: [stable]
    defaults:
      run:
        working-directory: packages/durable_queue_workmanager
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.channel }}
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - run: flutter pub publish --dry-run

  durable_queue_transfer:
    # A Flutter package outside the Dart workspace, resolved on its own.
    # background_downloader needs Flutter 3.47 or later.
    name: durable_queue_transfer (Flutter ${{ matrix.channel }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        channel: [stable]
    defaults:
      run:
        working-directory: packages/durable_queue_transfer
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.channel }}
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - run: flutter pub publish --dry-run

  durable_queue_demo:
    # The demo app: analysis and the demo server tests. The kill tests on an
    # emulator and a simulator are in device-tests.yml.
    name: durable_queue_demo (Flutter ${{ matrix.channel }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        channel: [stable]
    defaults:
      run:
        working-directory: examples/durable_queue_demo
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.channel }}
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --fatal-infos
      - run: flutter test

  cookbook:
    # The recipes of docs/cookbook.md must keep compiling.
    name: cookbook (Flutter ${{ matrix.channel }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        channel: [stable]
    defaults:
      run:
        working-directory: examples/cookbook
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.channel }}
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --fatal-infos
      - run: flutter test