# Workspace root for the durable_queue packages. Not published.
#
# Run `dart pub get` here once; it resolves every package listed below.
name: durable_queue_workspace
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - packages/durable_queue
  - packages/durable_queue_dio
  - packages/durable_queue_encryption
  - packages/durable_queue_sqlite
  - packages/durable_queue_test_support

# Not in the workspace: packages/durable_queue_connectivity,
# packages/durable_queue_flutter, packages/durable_queue_transfer, and
# packages/durable_queue_workmanager, nor the apps in examples/.
# They need the Flutter SDK, and a Flutter member would make `dart pub get`
# fail for every package here. Run `flutter pub get` inside their folders
# instead.
