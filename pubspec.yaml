# Workspace root for the durable_queue packages. Not published.
#
# Run `dart pub get` here once; it resolves every package listed below.
name: durable_queue_workspace
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - packages/durable_queue
  - packages/durable_queue_dio
  - packages/durable_queue_sqlite
  - packages/durable_queue_test_support
